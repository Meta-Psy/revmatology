version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: rheumatology_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rheumatology_backend
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
    depends_on:
      - db
    volumes:
      - uploads_data:/app/uploads
    networks:
      - internal

  nginx:
    image: nginx:alpine
    container_name: rheumatology_nginx
    restart: always
    # Reload раз в 6ч, чтобы подхватывать продлённый certbot'ом сертификат
    # из общего тома certbot_data. nginx остаётся главным процессом контейнера.
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - uploads_data:/app/uploads:ro
      - certbot_data:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - backend
    networks:
      - internal

  certbot:
    image: certbot/certbot
    container_name: rheumatology_certbot
    restart: always
    # Петля автопродления: раз в 12ч проверяет срок и продлевает при необходимости.
    # certbot renew — no-op, если до истечения > 30 дней. Конфиг webroot уже
    # записан в /etc/letsencrypt/renewal/ при первичном выпуске.
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"
    volumes:
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks:
      - internal

volumes:
  postgres_data:
  uploads_data:
  certbot_data:
  certbot_www:

networks:
  internal:
    driver: bridge
