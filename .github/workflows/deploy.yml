name: Deploy to DigitalOcean

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Cleanup server disk space
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set +e
            echo "=== Disk BEFORE cleanup ==="
            df -h /
            echo "=== Docker disk usage ==="
            docker system df
            echo "=== Pruning Docker build cache ==="
            docker builder prune -af
            echo "=== Pruning dangling/unused images ==="
            docker image prune -af
            echo "=== Pruning stopped containers ==="
            docker container prune -f
            echo "=== Vacuuming git in repo ==="
            cd ~/apps/revmatology && git gc --auto
            echo "=== Disk AFTER cleanup ==="
            df -h /

      - name: Deploy backend
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/apps/revmatology
            git fetch origin --prune
            git checkout -B main origin/main
            docker compose -f docker-compose.prod.yml up -d --build backend

      - name: Run database migrations
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/apps/revmatology
            docker compose -f docker-compose.prod.yml exec -T backend alembic upgrade head

      - name: Upload frontend dist
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: frontend/dist/
          target: ~/apps/revmatology/
          overwrite: true

      - name: Set permissions and apply stack
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            chmod -R 755 ~/apps/revmatology/frontend/dist
            cd ~/apps/revmatology
            # up -d, а не restart: применяет изменения command/entrypoint из
            # compose (петли автопродления certbot/nginx) и поднимает certbot.
            # Пересоздаются только сервисы с изменившимся конфигом.
            docker compose -f docker-compose.prod.yml up -d
